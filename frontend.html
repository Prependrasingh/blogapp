<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inkwell — Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Header -->
    <header>
      <div class="header-inner">
        <a href="#" class="logo">Ink<em>well</em></a>
        <div class="header-actions">
          <button
            class="btn btn-outline btn-sm"
            onclick="
              document.getElementById('write-title').focus();
              document
                .querySelector('.sidebar')
                .scrollIntoView({ behavior: 'smooth' });
            "
          >
            ✍ Write
          </button>
        </div>
      </div>
    </header>

    <!-- Masthead -->
    <div class="masthead">
      <div class="masthead-date" id="masthead-date"></div>
      <h1 class="masthead-title">Stories Worth <em>Reading</em></h1>
      <p class="masthead-sub">
        A space for ideas, perspectives, and writing that matters. Share yours.
      </p>
      <div class="masthead-divider">
        <div class="masthead-divider-line"></div>
        <div class="masthead-divider-dot"></div>
        <div class="masthead-divider-line"></div>
      </div>
    </div>

    <!-- Page body -->
    <div class="page">
      <!-- Feed -->
      <main>
        <div class="feed-header">
          <h2>Latest Posts</h2>
          <span class="post-count" id="post-count">Loading…</span>
        </div>
        <div id="feed"></div>
      </main>

      <!-- Sidebar -->
      <aside class="sidebar">
        <!-- Write post -->
        <div class="sidebar-widget">
          <div class="widget-title">✍ Write a Post</div>
          <div class="form-group">
            <label class="form-label">Title</label>
            <input
              type="text"
              class="form-input"
              id="write-title"
              placeholder="Your headline…"
              maxlength="120"
            />
          </div>
          <div class="form-group">
            <label class="form-label">Body</label>
            <textarea
              class="form-input"
              id="write-body"
              placeholder="What's on your mind?"
            ></textarea>
          </div>
          <button
            class="btn btn-primary"
            style="width: 100%"
            id="publish-btn"
            onclick="publishPost()"
          >
            Publish Post
          </button>
        </div>

        <!-- Stats -->
        <div class="sidebar-widget">
          <div class="widget-title">📊 Stats</div>
          <div class="stats-row">
            <div class="stat-box">
              <div class="stat-num" id="s-posts">0</div>
              <div class="stat-label">Posts</div>
            </div>
            <div class="stat-box">
              <div class="stat-num" id="s-comments">0</div>
              <div class="stat-label">Comments</div>
            </div>
            <div class="stat-box">
              <div class="stat-num" id="s-likes">0</div>
              <div class="stat-label">Likes</div>
            </div>
          </div>
        </div>

        <!-- Recent -->
        <div class="sidebar-widget">
          <div class="widget-title">🗂 Recent Posts</div>
          <div id="recent-list"></div>
        </div>
      </aside>
    </div>

    <!-- Toast container -->
    <div class="toast-wrap" id="toasts"></div>

    <script>
      // ── CONFIG ──────────────────────────────────────────────
      const API = "https://blogapp-swfa.onrender.com/api/v1";

      // ── STATE ───────────────────────────────────────────────
      let posts = [];
      let username =
        localStorage.getItem("blog_username") ||
        "Reader" + Math.floor(Math.random() * 1000);
      localStorage.setItem("blog_username", username);

      // ── INIT ────────────────────────────────────────────────
      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("masthead-date").textContent =
          new Date().toLocaleDateString("en-IN", {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric",
          });
        fetchPosts();
      });

      // ── API ─────────────────────────────────────────────────
      async function apiFetch(path, opts = {}) {
        const res = await fetch(`${API}${path}`, {
          headers: { "Content-Type": "application/json" },
          ...opts,
        });
        const json = await res.json();
        if (!res.ok)
          throw new Error(json.error || json.message || "Request failed");
        return json;
      }

      // ── FETCH POSTS ─────────────────────────────────────────
      async function fetchPosts() {
        showSkeletons();
        try {
          const data = await apiFetch("/Posts");
          posts = (data.Posts || []).reverse();
          renderFeed();
          updateSidebar();
        } catch (e) {
          document.getElementById("feed").innerHTML = `
      <div class="empty-feed">
        <div class="empty-icon">⚠️</div>
        <div class="empty-title">Could not load posts</div>
        <div class="empty-desc">${esc(e.message)}</div>
      </div>`;
          document.getElementById("post-count").textContent = "Error";
        }
      }

      // ── RENDER FEED ─────────────────────────────────────────
      function renderFeed() {
        const feed = document.getElementById("feed");
        document.getElementById("post-count").textContent =
          posts.length + " post" + (posts.length !== 1 ? "s" : "");

        if (posts.length === 0) {
          feed.innerHTML = `
      <div class="empty-feed">
        <div class="empty-icon">📰</div>
        <div class="empty-title">No posts yet</div>
        <div class="empty-desc">Be the first to publish something.</div>
      </div>`;
          return;
        }

        feed.innerHTML = posts
          .map((p, i) => {
            const likeCount = p.likes?.length || 0;
            const commentCount = p.comments?.length || 0;
            const preview =
              p.body.length > 220 ? p.body.slice(0, 220) + "…" : p.body;

            return `
    <article class="post-card" id="card-${p._id}">
      <div class="post-card-header">
        <div class="post-meta-row">
          <span class="post-tag">Story</span>
          <span class="post-date">${formatDate(p._id)}</span>
        </div>
        <h2 class="post-title">${esc(p.title)}</h2>
      </div>
      <p class="post-body-preview">${esc(preview)}</p>
      <div class="post-card-footer">
        <div class="post-stats">
          <button class="stat-btn ${isLiked(p._id) ? "liked" : ""}" id="like-btn-${p._id}" onclick="toggleLike('${p._id}', ${likeCount})">
            <svg viewBox="0 0 24 24" fill="${isLiked(p._id) ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
            <span id="like-count-${p._id}">${likeCount}</span>
          </button>
          <button class="stat-btn" onclick="toggleComments('${p._id}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            <span id="comment-count-${p._id}">${commentCount}</span>
          </button>
        </div>
        <button class="expand-btn" onclick="toggleComments('${p._id}')">
          Read & comment <span style="font-size:0.9rem">→</span>
        </button>
      </div>

      <!-- Comments -->
      <div class="comments-section" id="comments-${p._id}">
        <div class="comments-title">Responses (${commentCount})</div>
        <div id="comment-list-${p._id}">
          ${renderComments(p.comments || [])}
        </div>
        <div class="comment-form">
          <div class="comment-inputs">
            <input class="c-input" id="cname-${p._id}" placeholder="Your name" value="${esc(username)}" />
            <input class="c-input" id="cbody-${p._id}" placeholder="Write a response…" />
          </div>
          <button class="btn btn-primary btn-sm" id="csubmit-${p._id}" onclick="postComment('${p._id}')">Post Response</button>
        </div>
      </div>
    </article>`;
          })
          .join("");
      }

      function renderComments(comments) {
        if (!comments || comments.length === 0)
          return `<p style="font-size:0.82rem;color:var(--muted2);margin-bottom:0.75rem">No responses yet. Be the first!</p>`;
        return comments
          .map((c) => {
            const name = typeof c === "object" ? c.user || "Anonymous" : "User";
            const body = typeof c === "object" ? c.body || "" : "";
            const initials = name.slice(0, 2).toUpperCase();
            return `
    <div class="comment-item">
      <div class="comment-avatar" style="background:${avatarColor(name)}">${initials}</div>
      <div>
        <div class="comment-user">${esc(name)}</div>
        <div class="comment-body">${esc(body)}</div>
      </div>
    </div>`;
          })
          .join("");
      }

      // ── PUBLISH POST ────────────────────────────────────────
      async function publishPost() {
        const title = document.getElementById("write-title").value.trim();
        const body = document.getElementById("write-body").value.trim();
        if (!title || !body) {
          showToast("Title and body are required", "error");
          return;
        }

        const btn = document.getElementById("publish-btn");
        btn.innerHTML = '<span class="spinner"></span> Publishing…';
        btn.disabled = true;

        try {
          const data = await apiFetch("/posts/create", {
            method: "POST",
            body: JSON.stringify({ title, body }),
          });
          posts.unshift(data.post);
          renderFeed();
          updateSidebar();
          document.getElementById("write-title").value = "";
          document.getElementById("write-body").value = "";
          showToast("Post published!", "success");
          document
            .getElementById("feed")
            .scrollIntoView({ behavior: "smooth" });
        } catch (e) {
          showToast("Failed: " + e.message, "error");
        } finally {
          btn.innerHTML = "Publish Post";
          btn.disabled = false;
        }
      }

      // ── LIKE / UNLIKE ───────────────────────────────────────
      function isLiked(postId) {
        const liked = JSON.parse(localStorage.getItem("liked_posts") || "{}");
        return !!liked[postId];
      }
      function getLikeId(postId) {
        const liked = JSON.parse(localStorage.getItem("liked_posts") || "{}");
        return liked[postId];
      }
      function setLiked(postId, likeId) {
        const liked = JSON.parse(localStorage.getItem("liked_posts") || "{}");
        liked[postId] = likeId;
        localStorage.setItem("liked_posts", JSON.stringify(liked));
      }
      function removeLiked(postId) {
        const liked = JSON.parse(localStorage.getItem("liked_posts") || "{}");
        delete liked[postId];
        localStorage.setItem("liked_posts", JSON.stringify(liked));
      }

      async function toggleLike(postId, currentCount) {
        const btn = document.getElementById(`like-btn-${postId}`);
        const countEl = document.getElementById(`like-count-${postId}`);
        if (btn.disabled) return;
        btn.disabled = true;

        try {
          if (isLiked(postId)) {
            // Unlike
            const likeId = getLikeId(postId);
            await apiFetch("/likes/unlike", {
              method: "POST",
              body: JSON.stringify({ post: postId, like: likeId }),
            });
            removeLiked(postId);
            btn.classList.remove("liked");
            btn.querySelector("svg").setAttribute("fill", "none");
            countEl.textContent = Math.max(
              0,
              parseInt(countEl.textContent) - 1,
            );
          } else {
            // Like
            const data = await apiFetch("/Likes/like", {
              method: "POST",
              body: JSON.stringify({ post: postId, user: username }),
            });
            setLiked(postId, data.like._id);
            btn.classList.add("liked");
            btn.querySelector("svg").setAttribute("fill", "currentColor");
            countEl.textContent = parseInt(countEl.textContent) + 1;
            btn.classList.add("pop");
            setTimeout(() => btn.classList.remove("pop"), 300);
          }
          updateSidebarLikes();
        } catch (e) {
          showToast("Could not update like: " + e.message, "error");
        } finally {
          btn.disabled = false;
        }
      }

      // ── POST COMMENT ────────────────────────────────────────
      async function postComment(postId) {
        const user =
          document.getElementById(`cname-${postId}`).value.trim() || username;
        const body = document.getElementById(`cbody-${postId}`).value.trim();
        if (!body) {
          showToast("Write something first!", "error");
          return;
        }

        const btn = document.getElementById(`csubmit-${postId}`);
        btn.innerHTML = '<span class="spinner"></span>';
        btn.disabled = true;

        try {
          const data = await apiFetch("/comments/create", {
            method: "POST",
            body: JSON.stringify({ post: postId, user, body }),
          });

          // Update local state
          const postIndex = posts.findIndex((p) => p._id === postId);
          if (postIndex !== -1) {
            if (!posts[postIndex].comments) posts[postIndex].comments = [];
            posts[postIndex].comments.push(data.comment);
          }

          // Update UI
          const listEl = document.getElementById(`comment-list-${postId}`);
          const commentHtml = `
      <div class="comment-item">
        <div class="comment-avatar" style="background:${avatarColor(user)}">${user.slice(0, 2).toUpperCase()}</div>
        <div>
          <div class="comment-user">${esc(user)}</div>
          <div class="comment-body">${esc(body)}</div>
        </div>
      </div>`;
          if (listEl.querySelector("p")) listEl.innerHTML = "";
          listEl.insertAdjacentHTML("beforeend", commentHtml);

          const countEl = document.getElementById(`comment-count-${postId}`);
          countEl.textContent = parseInt(countEl.textContent) + 1;

          document.getElementById(`cbody-${postId}`).value = "";
          localStorage.setItem("blog_username", user);
          username = user;
          updateSidebarComments();
          showToast("Response posted!", "success");
        } catch (e) {
          showToast("Failed: " + e.message, "error");
        } finally {
          btn.innerHTML = "Post Response";
          btn.disabled = false;
        }
      }

      // ── TOGGLE COMMENTS ─────────────────────────────────────
      function toggleComments(postId) {
        const section = document.getElementById(`comments-${postId}`);
        section.classList.toggle("open");
      }

      // ── SIDEBAR ─────────────────────────────────────────────
      function updateSidebar() {
        document.getElementById("s-posts").textContent = posts.length;
        updateSidebarComments();
        updateSidebarLikes();

        // Recent list
        const recent = document.getElementById("recent-list");
        recent.innerHTML = posts
          .slice(0, 5)
          .map(
            (p, i) => `
    <div class="recent-item" onclick="document.getElementById('card-${p._id}').scrollIntoView({behavior:'smooth'})">
      <span class="recent-num">0${i + 1}</span>
      <div>
        <div class="recent-title">${esc(p.title)}</div>
        <div class="recent-meta">${p.likes?.length || 0} likes · ${p.comments?.length || 0} comments</div>
      </div>
    </div>`,
          )
          .join("");
      }
      function updateSidebarComments() {
        const total = posts.reduce(
          (sum, p) => sum + (p.comments?.length || 0),
          0,
        );
        document.getElementById("s-comments").textContent = total;
      }
      function updateSidebarLikes() {
        const total = posts.reduce((sum, p) => sum + (p.likes?.length || 0), 0);
        document.getElementById("s-likes").textContent = total;
      }

      // ── HELPERS ─────────────────────────────────────────────
      function showSkeletons() {
        document.getElementById("feed").innerHTML = [1, 2, 3]
          .map(
            () => `
    <div class="skel-card">
      <div class="skeleton" style="height:14px;width:15%;margin-bottom:12px"></div>
      <div class="skeleton" style="height:22px;width:75%;margin-bottom:8px"></div>
      <div class="skeleton" style="height:14px;width:100%;margin-bottom:5px"></div>
      <div class="skeleton" style="height:14px;width:90%;margin-bottom:5px"></div>
      <div class="skeleton" style="height:14px;width:70%"></div>
    </div>`,
          )
          .join("");
      }

      function formatDate(objectId) {
        try {
          const ts = parseInt(objectId.substring(0, 8), 16) * 1000;
          return new Date(ts).toLocaleDateString("en-IN", {
            day: "numeric",
            month: "short",
            year: "numeric",
          });
        } catch {
          return "";
        }
      }

      function esc(str) {
        return String(str || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function avatarColor(name) {
        const colors = [
          "#1a1a2e",
          "#c94f3a",
          "#3a6ec9",
          "#3aad6e",
          "#c8933a",
          "#7a3ac9",
        ];
        let h = 0;
        for (let i = 0; i < name.length; i++)
          h = name.charCodeAt(i) + ((h << 5) - h);
        return colors[Math.abs(h) % colors.length];
      }

      function showToast(msg, type = "info") {
        const wrap = document.getElementById("toasts");
        const el = document.createElement("div");
        el.className = `toast ${type}`;
        el.textContent = msg;
        wrap.appendChild(el);
        setTimeout(() => el.remove(), 3500);
      }
    </script>
  </body>
</html>
