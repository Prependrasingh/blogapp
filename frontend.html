<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inkwell — Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --ink: #1a1a2e;
        --paper: #f7f4ef;
        --paper2: #ede9e1;
        --paper3: #e2ddd4;
        --accent: #c94f3a;
        --accent-light: rgba(201, 79, 58, 0.1);
        --muted: #7a7870;
        --muted2: #a8a49c;
        --border: rgba(26, 26, 46, 0.1);
        --border2: rgba(26, 26, 46, 0.18);
        --shadow: 0 2px 12px rgba(26, 26, 46, 0.08);
        --shadow-lg: 0 8px 28px rgba(26, 26, 46, 0.12);
        --serif: "Playfair Display", Georgia, serif;
        --sans: "Inter", system-ui, sans-serif;
        --radius: 6px;
      }
      body {
        font-family: var(--sans);
        background: var(--paper);
        color: var(--ink);
      }
      a {
        text-decoration: none;
        color: inherit;
      }

      /* Header */
      header {
        background: var(--ink);
        padding: 1.1rem 2rem;
        border-bottom: 3px solid var(--accent);
      }
      .logo {
        font-family: var(--serif);
        font-size: 1.5rem;
        color: var(--paper);
        text-align: center;
      }
      .logo em {
        color: var(--accent);
        font-style: italic;
      }

      /* Masthead */
      .masthead {
        background: var(--ink);
        padding: 2.5rem 2rem;
        text-align: center;
      }
      .masthead h1 {
        font-family: var(--serif);
        font-size: clamp(2rem, 5vw, 3rem);
        color: var(--paper);
        margin-bottom: 0.5rem;
      }
      .masthead h1 em {
        color: var(--accent);
      }
      .masthead p {
        color: var(--muted2);
        font-size: 0.9rem;
        max-width: 460px;
        margin: 0 auto;
      }

      /* Layout */
      .page {
        max-width: 1000px;
        margin: 0 auto;
        padding: 2rem;
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 2rem;
      }
      @media (max-width: 760px) {
        .page {
          grid-template-columns: 1fr;
        }
        .write-box {
          order: -1;
        }
      }

      /* Write box */
      .write-box {
        background: white;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.25rem;
        box-shadow: var(--shadow);
        align-self: start;
      }
      .write-box h3 {
        font-family: var(--serif);
        font-size: 1rem;
        margin-bottom: 1rem;
      }
      .field {
        margin-bottom: 0.85rem;
      }
      .field label {
        display: block;
        font-size: 0.7rem;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 0.3rem;
      }
      .field input,
      .field textarea {
        width: 100%;
        border: 1px solid var(--border2);
        border-radius: var(--radius);
        padding: 0.55rem 0.7rem;
        font: inherit;
        font-size: 0.85rem;
        background: var(--paper);
        outline: none;
        transition: border-color 0.15s;
      }
      .field input:focus,
      .field textarea:focus {
        border-color: var(--accent);
        background: white;
      }
      .field textarea {
        resize: vertical;
        min-height: 110px;
        line-height: 1.5;
      }

      button {
        font: inherit;
        cursor: pointer;
        border: none;
        border-radius: var(--radius);
      }
      .btn-primary {
        background: var(--accent);
        color: white;
        padding: 0.6rem 1rem;
        width: 100%;
        font-weight: 500;
        font-size: 0.85rem;
      }
      .btn-primary:hover {
        opacity: 0.92;
      }
      .btn-primary:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .btn-text {
        background: none;
        color: var(--ink);
        font-size: 0.8rem;
        font-weight: 500;
        padding: 4px 6px;
      }
      .btn-text:hover {
        color: var(--accent);
      }

      /* Feed */
      .feed h2 {
        font-family: var(--serif);
        font-size: 1.05rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        border-bottom: 2px solid var(--ink);
        padding-bottom: 0.6rem;
        margin-bottom: 1.25rem;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .feed h2 span {
        font-family: var(--sans);
        font-size: 0.78rem;
        color: var(--muted);
        text-transform: none;
      }

      .post {
        background: white;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin-bottom: 1.25rem;
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .post-head {
        padding: 1.2rem 1.2rem 0;
      }
      .post-meta {
        font-size: 0.74rem;
        color: var(--muted2);
        margin-bottom: 0.5rem;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .post-meta .tag {
        background: var(--accent-light);
        color: var(--accent);
        padding: 1px 7px;
        border-radius: 3px;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.65rem;
        letter-spacing: 0.03em;
      }
      .post-title {
        font-family: var(--serif);
        font-size: 1.25rem;
        line-height: 1.3;
        margin-bottom: 0.5rem;
      }
      .post-body {
        padding: 0 1.2rem;
        font-size: 0.88rem;
        color: var(--muted);
        line-height: 1.7;
        white-space: pre-wrap;
      }
      .post-body.full {
        color: var(--ink);
      }

      .post-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.85rem 1.2rem;
        border-top: 1px solid var(--border);
        margin-top: 1rem;
        background: var(--paper);
        flex-wrap: wrap;
        gap: 8px;
      }
      .post-stats {
        display: flex;
        gap: 0.5rem;
      }
      .stat {
        display: flex;
        align-items: center;
        gap: 4px;
        background: none;
        border: none;
        color: var(--muted);
        font-size: 0.8rem;
        padding: 4px 8px;
        border-radius: var(--radius);
      }
      .stat:hover {
        background: var(--accent-light);
        color: var(--accent);
      }
      .stat.liked {
        color: var(--accent);
      }
      .stat svg {
        width: 14px;
        height: 14px;
      }

      /* Comments */
      .comments {
        display: none;
        border-top: 1px solid var(--border);
        background: var(--paper);
        padding: 1rem 1.2rem;
      }
      .comments.open {
        display: block;
      }
      .comments h4 {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin-bottom: 0.75rem;
      }
      .comment {
        display: flex;
        gap: 8px;
        margin-bottom: 0.7rem;
      }
      .avatar {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--ink);
        color: var(--paper);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.65rem;
        font-weight: 600;
        flex-shrink: 0;
      }
      .comment-name {
        font-size: 0.78rem;
        font-weight: 600;
      }
      .comment-text {
        font-size: 0.82rem;
        color: var(--muted);
      }
      .comment-form {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 0.75rem;
      }
      .comment-form input,
      .comment-form textarea {
        border: 1px solid var(--border2);
        border-radius: var(--radius);
        padding: 0.5rem 0.65rem;
        font: inherit;
        font-size: 0.8rem;
        outline: none;
        background: white;
      }
      .comment-form textarea {
        resize: none;
        min-height: 56px;
      }

      /* Sidebar widgets */
      .widget {
        background: white;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.1rem;
        box-shadow: var(--shadow);
        margin-top: 1.25rem;
      }
      .widget h3 {
        font-family: var(--serif);
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        border-bottom: 2px solid var(--ink);
        padding-bottom: 0.5rem;
        margin-bottom: 0.9rem;
      }
      .stat-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
      }
      .stat-grid div {
        text-align: center;
        background: var(--paper);
        border-radius: var(--radius);
        padding: 0.6rem 0;
      }
      .stat-grid b {
        display: block;
        font-family: var(--serif);
        font-size: 1.3rem;
      }
      .stat-grid small {
        font-size: 0.62rem;
        color: var(--muted);
        text-transform: uppercase;
      }

      /* States */
      .empty {
        text-align: center;
        padding: 3rem 1.5rem;
        background: white;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--muted);
      }
      .empty .icon {
        font-size: 2rem;
        opacity: 0.4;
        margin-bottom: 0.5rem;
      }
      .skel {
        background: white;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.2rem;
        margin-bottom: 1.25rem;
      }
      .bar {
        background: linear-gradient(
          90deg,
          var(--paper2) 25%,
          var(--paper3) 50%,
          var(--paper2) 75%
        );
        background-size: 200% 100%;
        animation: load 1.3s infinite;
        border-radius: 4px;
        height: 14px;
        margin-bottom: 8px;
      }
      @keyframes load {
        to {
          background-position: -200% 0;
        }
      }
      .spin {
        display: inline-block;
        width: 13px;
        height: 13px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-top-color: white;
        border-radius: 50%;
        animation: rot 0.6s linear infinite;
        margin-right: 5px;
      }
      @keyframes rot {
        to {
          transform: rotate(360deg);
        }
      }

      /* Toast */
      #toast {
        position: fixed;
        bottom: 1.5rem;
        left: 50%;
        transform: translateX(-50%) translateY(10px);
        background: var(--ink);
        color: white;
        padding: 0.6rem 1.1rem;
        border-radius: 100px;
        font-size: 0.82rem;
        opacity: 0;
        transition: 0.2s;
        pointer-events: none;
        border-left: 3px solid var(--accent);
      }
      #toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      #toast.error {
        border-left-color: #c94f3a;
      }
      #toast.success {
        border-left-color: #3aad6e;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">Ink<em>well</em></div>
    </header>

    <div class="masthead">
      <h1>Stories Worth <em>Reading</em></h1>
      <p>
        A space for ideas, perspectives, and writing that matters. Share yours.
      </p>
    </div>

    <div class="page">
      <main class="feed">
        <h2>Latest Posts <span id="count">loading…</span></h2>
        <div id="feed"></div>
      </main>

      <aside>
        <div class="write-box">
          <h3>✍ Write a Post</h3>
          <div class="field">
            <label>Title</label
            ><input id="f-title" placeholder="Your headline…" maxlength="120" />
          </div>
          <div class="field">
            <label>Body</label
            ><textarea
              id="f-body"
              placeholder="What's on your mind?"
            ></textarea>
          </div>
          <button class="btn-primary" id="publish" onclick="publish()">
            Publish Post
          </button>
        </div>

        <div class="widget">
          <h3>Stats</h3>
          <div class="stat-grid">
            <div><b id="st-posts">0</b><small>Posts</small></div>
            <div><b id="st-comments">0</b><small>Comments</small></div>
            <div><b id="st-likes">0</b><small>Likes</small></div>
          </div>
        </div>
      </aside>
    </div>

    <div id="toast"></div>

    <script>
      const API = "https://blogapp-swfa.onrender.com/api/v1";
      let posts = [];
      let myName = localStorage.getItem("name") || "";

      const $ = (id) => document.getElementById(id);

      document.addEventListener("DOMContentLoaded", () => {
        load();
      });

      async function call(path, body) {
        const res = await fetch(API + path, {
          method: body ? "POST" : "GET",
          headers: { "Content-Type": "application/json" },
          body: body ? JSON.stringify(body) : undefined,
        });
        const data = await res.json();
        if (!res.ok)
          throw new Error(data.error || data.message || "Request failed");
        return data;
      }

      async function load() {
        $("feed").innerHTML = [1, 2, 3]
          .map(
            () => `
    <div class="skel"><div class="bar" style="width:30%"></div><div class="bar" style="width:70%;height:20px"></div><div class="bar" style="width:90%"></div></div>
  `,
          )
          .join("");
        try {
          const data = await call("/Posts");
          posts = data.Posts || [];
          draw();
        } catch (e) {
          $("feed").innerHTML =
            `<div class="empty"><div class="icon">⚠️</div>Could not load posts<br><small>${e.message}</small></div>`;
          $("count").textContent = "error";
        }
      }

      function draw() {
        $("count").textContent =
          posts.length + " post" + (posts.length === 1 ? "" : "s");

        if (!posts.length) {
          $("feed").innerHTML =
            `<div class="empty"><div class="icon">📰</div>No posts yet — be the first!</div>`;
          return;
        }

        $("feed").innerHTML = posts
          .map((p) => {
            const likes = p.likes?.length || 0;
            const comments = p.comments?.length || 0;
            const long = p.body.length > 280;
            const liked = isLiked(p._id);

            return `
    <article class="post" id="post-${p._id}">
      <div class="post-head">
        <div class="post-meta">
          <span class="tag">Story</span>
        </div>
        <h3 class="post-title">${esc(p.title)}</h3>
      </div>
      <p class="post-body" id="body-${p._id}">${esc(long ? p.body.slice(0, 280) + "…" : p.body)}</p>
      <div class="post-foot">
        <div class="post-stats">
          <button class="stat ${liked ? "liked" : ""}" onclick="like('${p._id}')">
            <svg viewBox="0 0 24 24" fill="${liked ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            <span id="lc-${p._id}">${likes}</span>
          </button>
          <button class="stat" onclick="toggleComments('${p._id}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span id="cc-${p._id}">${comments}</span>
          </button>
        </div>
        <div>
          ${long ? `<button class="btn-text" onclick="toggleFull('${p._id}', \`${escAttr(p.body)}\`)" id="more-${p._id}">Read more →</button>` : ""}
          <button class="btn-text" onclick="toggleComments('${p._id}')">Comment</button>
        </div>
      </div>
      <div class="comments" id="comments-${p._id}">
        <h4>Responses (${comments})</h4>
        <div id="clist-${p._id}">${renderComments(p.comments)}</div>
        <div class="comment-form">
          <input id="cn-${p._id}" placeholder="Your name" value="${esc(myName)}">
          <textarea id="cb-${p._id}" placeholder="Write a response…"></textarea>
          <button class="btn-primary" onclick="comment('${p._id}')" id="cbtn-${p._id}">Post Response</button>
        </div>
      </div>
    </article>`;
          })
          .join("");

        $("st-posts").textContent = posts.length;
        $("st-comments").textContent = posts.reduce(
          (s, p) => s + (p.comments?.length || 0),
          0,
        );
        $("st-likes").textContent = posts.reduce(
          (s, p) => s + (p.likes?.length || 0),
          0,
        );
      }

      function renderComments(list) {
        if (!list || !list.length)
          return `<p style="font-size:0.8rem;color:var(--muted2)">No responses yet.</p>`;
        return list
          .map((c) => {
            const name = c?.user || "Anonymous";
            return `<div class="comment">
      <div class="avatar" style="background:${color(name)}">${name.slice(0, 2).toUpperCase()}</div>
      <div><div class="comment-name">${esc(name)}</div><div class="comment-text">${esc(c?.body || "")}</div></div>
    </div>`;
          })
          .join("");
      }

      async function publish() {
        const title = $("f-title").value.trim();
        const body = $("f-body").value.trim();
        if (!title || !body)
          return toast("Title and body are required", "error");

        const btn = $("publish");
        btn.innerHTML = '<span class="spin"></span>Publishing…';
        btn.disabled = true;
        try {
          const data = await call("/posts/create", { title, body });
          posts.unshift(data.post);
          draw();
          $("f-title").value = "";
          $("f-body").value = "";
          toast("Post published!", "success");
        } catch (e) {
          toast(e.message, "error");
        } finally {
          btn.textContent = "Publish Post";
          btn.disabled = false;
        }
      }

      function toggleFull(id, fullText) {
        const el = $("body-" + id);
        const btn = $("more-" + id);
        const expanded = el.classList.contains("full");
        el.textContent = expanded ? fullText.slice(0, 280) + "…" : fullText;
        el.classList.toggle("full");
        btn.textContent = expanded ? "Read more →" : "← Read less";
      }

      function toggleComments(id) {
        $("comments-" + id).classList.toggle("open");
      }

      function isLiked(id) {
        return !!JSON.parse(localStorage.getItem("liked") || "{}")[id];
      }
      function setLiked(id, likeId) {
        const l = JSON.parse(localStorage.getItem("liked") || "{}");
        l[id] = likeId;
        localStorage.setItem("liked", JSON.stringify(l));
      }
      function unsetLiked(id) {
        const l = JSON.parse(localStorage.getItem("liked") || "{}");
        delete l[id];
        localStorage.setItem("liked", JSON.stringify(l));
      }

      async function like(id) {
        const liked = isLiked(id);
        const lcEl = $("lc-" + id);
        try {
          if (liked) {
            const likeId = JSON.parse(localStorage.getItem("liked") || "{}")[
              id
            ];
            await call("/likes/unlike", { post: id, like: likeId });
            unsetLiked(id);
            lcEl.textContent = Math.max(0, +lcEl.textContent - 1);
          } else {
            const data = await call("/Likes/like", {
              post: id,
              user: myName || "Anonymous",
            });
            setLiked(id, data.like._id);
            lcEl.textContent = +lcEl.textContent + 1;
          }
          document
            .querySelector(`#post-${id} .stat`)
            .classList.toggle("liked", !liked);
          document
            .querySelector(`#post-${id} .stat svg`)
            .setAttribute("fill", liked ? "none" : "currentColor");
          $("st-likes").textContent =
            +$("st-likes").textContent + (liked ? -1 : 1);
        } catch {
          toast("Could not update like", "error");
        }
      }

      async function comment(id) {
        const user = $("cn-" + id).value.trim() || "Anonymous";
        const body = $("cb-" + id).value.trim();
        if (!body) return toast("Write something first", "error");

        const btn = $("cbtn-" + id);
        btn.innerHTML = '<span class="spin"></span>';
        btn.disabled = true;
        try {
          await call("/comments/create", { post: id, user, body });
          const list = $("clist-" + id);
          if (list.querySelector("p")) list.innerHTML = "";
          list.insertAdjacentHTML(
            "beforeend",
            `
      <div class="comment"><div class="avatar" style="background:${color(user)}">${user.slice(0, 2).toUpperCase()}</div>
      <div><div class="comment-name">${esc(user)}</div><div class="comment-text">${esc(body)}</div></div></div>`,
          );
          $("cc-" + id).textContent = +$("cc-" + id).textContent + 1;
          $("cb-" + id).value = "";
          localStorage.setItem("name", user);
          myName = user;
          $("st-comments").textContent = +$("st-comments").textContent + 1;
          toast("Response posted!", "success");
        } catch (e) {
          toast(e.message, "error");
        } finally {
          btn.textContent = "Post Response";
          btn.disabled = false;
        }
      }

      function esc(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function escAttr(s) {
        return String(s || "")
          .replace(/\\/g, "\\\\")
          .replace(/`/g, "\\`")
          .replace(/\$/g, "\\$");
      }
      function color(name) {
        const c = [
          "#1a1a2e",
          "#c94f3a",
          "#3a6ec9",
          "#3aad6e",
          "#c8933a",
          "#7a3ac9",
        ];
        let h = 0;
        for (let i = 0; i < name.length; i++)
          h = name.charCodeAt(i) + ((h << 5) - h);
        return c[Math.abs(h) % c.length];
      }
      let toastTimer;
      function toast(msg, type = "") {
        const t = $("toast");
        t.textContent = msg;
        t.className = type + " show";
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
      }
    </script>
  </body>
</html>
